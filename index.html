<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CHALLENGE – Better You. Bigger Future.</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090a;--bg2:#0f1412;--card:rgba(255,255,255,.045);--bd:rgba(255,255,255,.1);--g:#39ff88;--tx:#f2f5f3;--mu:#8b9690;--bad:#ff5d6c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#10301f55,transparent),var(--bg);color:var(--tx);font:15px/1.5 'Space Grotesk','Cairo',system-ui,sans-serif;min-height:100vh}
[dir=rtl] body{font-family:'Cairo','Space Grotesk',sans-serif}
a{color:inherit;text-decoration:none}h1,h2,h3{margin:0 0 .5rem;line-height:1.15}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;backdrop-filter:blur(12px)}
.btn{background:var(--g);color:#04120a;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.s{padding:5px 10px;font-size:13px;border-radius:9px}.btn.d{background:var(--bad);color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:2px}
input,select,textarea{width:100%;background:#0b100e;border:1px solid var(--bd);color:var(--tx);border-radius:11px;padding:10px 12px;font:inherit}
label{display:block;color:var(--mu);font-size:13px;margin:10px 0 4px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav.side{border-inline-end:1px solid var(--bd);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;background:#080b0a}
nav.side a{display:block;padding:9px 12px;border-radius:10px;color:var(--mu);margin:2px 0}
nav.side a.on,nav.side a:hover{background:#39ff8818;color:var(--g)}
main{padding:22px;max-width:1100px;width:100%}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stat b{display:block;font-size:30px;color:var(--g)}.stat span,.mu{color:var(--mu);font-size:13px}
.bar{height:8px;background:#ffffff14;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .5s}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}.tabs button{background:none;border:1px solid var(--bd);color:var(--mu);padding:7px 14px;border-radius:99px;cursor:pointer;font:inherit}.tabs .on{background:var(--g);color:#04120a;border-color:var(--g)}
.hero{text-align:center;padding:60px 18px 30px;max-width:860px;margin:auto}.hero h1{font-size:clamp(38px,7vw,74px)}.hero h1 em{font-style:normal;color:var(--g)}
.days{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:420px;margin:26px auto}.days i{aspect-ratio:1;border-radius:7px;border:1px solid var(--bd);animation:lit 3s infinite}
@keyframes lit{0%,60%{background:transparent}70%,100%{background:#39ff8855;box-shadow:0 0 10px #39ff8888}}
.auth{max-width:420px;margin:30px auto}.err{color:var(--bad);font-size:13px;min-height:18px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--g);color:var(--g);font-size:12px;margin:2px}.badge.off{border-color:var(--bd);color:var(--mu)}
.toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--g);color:#04120a;padding:10px 18px;border-radius:12px;font-weight:700;z-index:9}
.cal{display:flex;gap:3px;flex-wrap:wrap}.cal i{width:16px;height:16px;border-radius:4px;background:#ffffff10}.cal i.y{background:var(--g)}
.av{width:44px;height:44px;border-radius:50%;background:#39ff8822;border:1px solid var(--g);display:grid;place-items:center;font-weight:700;color:var(--g);overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.mdone{text-decoration:line-through;color:var(--mu)}svg text{fill:var(--mu);font-size:10px}
@media(max-width:760px){.shell{grid-template-columns:1fr}nav.side{position:static;height:auto;display:flex;overflow-x:auto;border:0;border-bottom:1px solid var(--bd)}nav.side a{white-space:nowrap}nav.side .logo{display:none}}
@media print{nav.side,.top,.noprint{display:none!important}.shell{display:block}body{background:#fff;color:#000}.card{border-color:#999}.stat b{color:#000}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script></head><body><div id="app"></div><div id="tt"></div>
<script>
const K='challenge_v2',TD=()=>new Date().toISOString().slice(0,10),ago=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
const L={en:{dash:'Dashboard',goals:'My goals',habits:'Habits',finance:'Finance',challenge:'Challenge',board:'Leaderboard',community:'Community',stats:'Statistics',profile:'Profile',notifs:'Notifications',settings:'Settings',admin:'Admin',logout:'Log out',login:'Log in',signup:'Sign up',tag:'Better You. Bigger Future.',welcome:'Welcome back',empty:'Nothing here yet. Add your first item above.'},
ar:{dash:'لوحة التحكم',goals:'أهدافي',habits:'العادات',finance:'المالية',challenge:'التحدي',board:'المتصدرون',community:'المجتمع',stats:'الإحصائيات',profile:'الملف الشخصي',notifs:'الإشعارات',settings:'الإعدادات',admin:'الإدارة',logout:'تسجيل الخروج',login:'تسجيل الدخول',signup:'إنشاء حساب',tag:'أنت أفضل. مستقبلك أكبر.',welcome:'مرحباً بعودتك',empty:'لا شيء هنا بعد. أضف أول عنصر أعلاه.'}};
const t=k=>(L[S.lang]||L.en)[k]||L.en[k]||k;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hs=p=>{let h=5381;for(const c of 'ch$'+p)h=(h*33)^c.charCodeAt(0);return String(h>>>0)};
const uid=()=>Math.random().toString(36).slice(2,9);
const newD=()=>({goals:[],habits:[],tx:[],target:0,cur:'DZD',ch:{active:null,history:[]},led:[],notifs:[],fol:[]});
function seed(){const names=['Yasmine B.','Karim L.','Amine H.','Lina M.','Sofiane R.','Nour D.'],users=[{id:'admin',name:'Admin',username:'admin',email:'admin@challenge.app',pw:hs('Admin123'),admin:1,pub:1,ver:1,sample:0}],data={admin:newD()},posts=[];
names.forEach((n,i)=>{const id='s'+i,p=(6-i)*120;users.push({id,name:n,username:n.split(' ')[0].toLowerCase(),email:id+'@sample.app',pw:'',pub:1,ver:1,sample:1});data[id]=newD();data[id].led=[{k:'a',pts:p,why:'Sample',d:ago(60)},{k:'b',pts:p/2,why:'Sample',d:ago(12)},{k:'c',pts:p/4,why:'Sample',d:TD()}];posts.push({id:'p'+i,uid:id,text:['Day 12 done. Showing up beats motivation.','Saved 20,000 DZD this month!','Woke up at 5am for 7 days straight.','Finished my first 30-day challenge.','Read 40 pages today. Small steps.','No smoking for 10 days. Keep going.'][i],likes:[],com:[],d:ago(i)})});
return{users,data,posts,reports:[],ses:null,lang:/^ar/i.test(navigator.language||'')?'ar':'en',ui:{tab:'daily',lb:'global',ctab:'all'},badges:[{n:'Starter',p:10},{n:'Rising',p:100},{n:'Focused',p:500},{n:'Unstoppable',p:1000}]}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}try{sync();cloudPush()}catch(e){}};
const me=()=>S.users.find(u=>u.id===S.ses),D=()=>S.data[S.ses],U=id=>S.users.find(u=>u.id===id)||{name:'Deleted',username:'?'};
const pts=(id,from)=>(S.data[id]?.led||[]).filter(l=>!from||l.d>=from).reduce((a,l)=>a+l.pts,0);
function award(k,p,why){const d=D();if(d.led.some(l=>l.k===k))return;d.led.push({k,pts:p,why,d:TD()});notify(S.ses,'+'+p+' pts – '+why)}
function notify(id,m){const d=S.data[id];if(d)d.notifs.unshift({id:uid(),m,d:TD(),r:0})}
function toast(m){const e=document.getElementById('tt');e.innerHTML='<div class="toast" role="status">'+esc(tr(m))+'</div>';setTimeout(()=>e.innerHTML='',2200)}
function activeDates(d){const s=new Set();d.goals.forEach(g=>g.dd&&s.add(g.dd));d.habits.forEach(h=>Object.keys(h.log).forEach(x=>s.add(x)));Object.keys(d.ch.active?.m||{}).forEach(i=>s.add(d.ch.active.m[i]));return s}
function streak(d){const s=activeDates(d);let n=0,i=s.has(TD())?0:1;while(s.has(ago(i))){n++;i++}return n}
function checkBonus(){const d=D(),n=streak(d);if(n>=7)award('st7:'+ago(n-1),50,'7-day streak');
const dg=d.goals.filter(g=>g.type==='daily'&&g.date===TD());if(dg.length&&dg.every(g=>g.done))award('all:'+TD(),30,'All daily goals done')}
function go(r){location.hash=r}
const route=()=>(location.hash||'#landing').slice(1);
const logo=(s=34)=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true"><path d="M3 41 18 15l7 11 5-7 15 22z" fill="none" stroke="#39ff88" stroke-width="2.5" stroke-linejoin="round"/><path d="m18 15 4 7-4 3-4-3z" fill="#39ff8833"/><path d="M36 6l1.3 3.2L40.5 10.5l-3.2 1.3L36 15l-1.3-3.2L31.5 10.5l3.2-1.3z" fill="#39ff88"/></svg>`;
const bars=(v,lb,h=110)=>{const m=Math.max(1,...v),w=100/v.length;return `<svg viewBox="0 0 100 ${h/2}" preserveAspectRatio="none" style="width:100%;height:${h}px"><g>${v.map((x,i)=>`<rect x="${i*w+w*.15}" y="${h/2-12-(x/m)*(h/2-16)}" width="${w*.7}" height="${(x/m)*(h/2-16)}" rx="1" fill="#39ff88" opacity=".85"/>`).join('')}</g></svg><div class="mu" style="display:flex;justify-content:space-between">${lb.map(l=>`<span>${l}</span>`).join('')}</div>`};
const pct=(a,b)=>b?Math.round(a/b*100):0,fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
const ini=u=>u.avatar?`<div class="av"><img alt="" src="${u.avatar}"></div>`:`<div class="av">${esc((u.name||'?')[0].toUpperCase())}</div>`;
/* ---------- actions ---------- */
const A={
signup(e){const f=fd(e),er=[];if(f.name.trim().length<2)er.push('Enter your full name.');if(!/^[a-z0-9_]{3,20}$/i.test(f.username))er.push('Username: 3–20 letters, numbers or _.');if(!/^\S+@\S+\.\S+$/.test(f.email))er.push('Enter a valid email.');if(f.password.length<8||!/\d/.test(f.password))er.push('Password needs 8+ characters and a number.');
if(S.users.some(u=>u.email===f.email.toLowerCase()||u.username.toLowerCase()===f.username.toLowerCase()))er.push('Email or username already used.');
if(er.length)return A.err(er.join(' '));const id=uid();S.users.push({id,name:f.name.trim(),username:f.username,email:f.email.toLowerCase(),pw:hs(f.password),pub:1,ver:0});S.data[id]=newD();S.ses=id;notify(id,'Welcome to CHALLENGE! Verify your email from Settings.');save();go('dash')},
login(e){const f=fd(e),u=S.users.find(x=>x.email===f.email.toLowerCase().trim());if(!u||u.pw!==hs(f.password)||u.sample)return A.err('Wrong email or password.');if(u.banned)return A.err('This account is suspended.');S.ses=u.id;save();go('dash')},
forgot(e){const f=fd(e),u=S.users.find(x=>x.email===f.email.toLowerCase().trim()&&!x.sample);if(!u)return A.err('No account with this email.');S.rst=u.id;save();render()},
reset(e){const f=fd(e);if(f.password.length<8||!/\d/.test(f.password))return A.err('Password needs 8+ characters and a number.');S.users.find(u=>u.id===S.rst).pw=hs(f.password);S.rst=null;save();toast('Password updated. Log in.');go('login')},
err(m){const x=document.getElementById('err');if(x)x.textContent=tr(m);return false},
logout(){S.ses=null;save();go('landing')},lang(){S.lang=S.lang==='en'?'ar':'en';save();render()},
tab(k,v){S.ui[k]=v;render()},
addGoal(e){const f=fd(e),d=D();if(f.title.trim().length<2)return toast('Enter a goal title.');d.goals.push({id:uid(),type:S.ui.tab,title:f.title.trim(),cat:f.cat||'',prio:f.prio||'medium',due:f.due||'',date:TD(),done:0});save();render()},
tg(id){const d=D(),g=d.goals.find(x=>x.id===id);g.done=!g.done;g.dd=g.done?TD():'';if(g.done){award('g:'+id,g.type==='daily'?10:g.type==='weekly'?100:150,g.type+' goal done');checkBonus()}save();render()},
eg(id){const g=D().goals.find(x=>x.id===id),v=prompt('Edit goal',g.title);if(v&&v.trim()){g.title=v.trim();save();render()}},
dg(id){D().goals=D().goals.filter(x=>x.id!==id);save();render()},
addHabit(e){const f=fd(e);if(f.name.trim().length<2)return toast('Enter a habit name.');D().habits.push({id:uid(),name:f.name.trim(),kind:f.kind,target:+f.target||1,log:{}});save();render()},
presetH(n,k){D().habits.push({id:uid(),name:n,kind:k,target:1,log:{}});save();render()},
th(id){const h=D().habits.find(x=>x.id===id);if(h.log[TD()])delete h.log[TD()];else{h.log[TD()]=TD();award('h:'+id+TD(),5,'Habit: '+h.name);checkBonus()}save();render()},
dh(id){D().habits=D().habits.filter(x=>x.id!==id);save();render()},
addTx(e){const f=fd(e),a=+f.amt;if(!(a>0))return toast('Enter an amount above 0.');D().tx.unshift({id:uid(),type:f.type,amt:a,cat:f.cat||'General',date:f.date||TD(),note:f.note});save();render()},
dtx(id){D().tx=D().tx.filter(x=>x.id!==id);save();render()},
tgt(e){const f=fd(e);D().target=Math.max(0,+f.target||0);D().cur=f.cur;save();render()},
join(){const d=D();if(d.ch.active)return;d.ch.active={id:uid(),name:'30-Day Transformation',start:TD(),m:{}};notify(S.ses,'Challenge started. Day 1 is today.');save();render()},
leave(){const d=D();if(confirm('Leave this challenge? Progress will move to history as abandoned.')){d.ch.history.unshift({...d.ch.active,end:TD(),status:'left',days:Object.keys(d.ch.active.m).length});d.ch.active=null;save();render()}},
mday(i){const d=D(),c=d.ch.active,cur=Math.floor((Date.now()-new Date(c.start))/864e5)+1;if(i>cur)return toast('You can’t complete a future day.');if(c.m[i])return;c.m[i]=TD();award('c:'+c.id+i,10,'Challenge day '+i);const n=Object.keys(c.m).length;if(n%7===0)notify(S.ses,'Milestone: '+n+' days completed!');if(n===30){award('cd:'+c.id,500,'30-day challenge completed');d.ch.history.unshift({...c,end:TD(),status:'done',days:30});d.ch.active=null}checkBonus();save();render()},
post(e){const f=fd(e);if(f.text.trim().length<3)return toast('Write at least a few words.');S.posts.unshift({id:uid(),uid:S.ses,text:f.text.trim().slice(0,400),likes:[],com:[],d:TD()});save();render()},
like(id){const p=S.posts.find(x=>x.id===id),i=p.likes.indexOf(S.ses);if(i<0){p.likes.push(S.ses);if(p.uid!==S.ses)notify(p.uid,U(S.ses).name+' liked your post')}else p.likes.splice(i,1);save();render()},
comment(id){const v=prompt('Your comment');if(!v||!v.trim())return;const p=S.posts.find(x=>x.id===id);p.com.push({uid:S.ses,text:v.trim().slice(0,200)});if(p.uid!==S.ses)notify(p.uid,U(S.ses).name+' commented on your post');save();render()},
follow(id){const f=D().fol,i=f.indexOf(id);if(i<0){f.push(id);notify(id,U(S.ses).name+' followed you')}else f.splice(i,1);save();render()},
report(id){const r=prompt('Why are you reporting this post?');if(r&&r.trim()){S.reports.push({id:uid(),pid:id,by:S.ses,why:r.trim(),d:TD()});save();toast('Report sent to moderators.')}},
saveProfile(e){const f=fd(e),u=me();if(f.name.trim().length<2)return toast('Enter your name.');u.name=f.name.trim();u.bio=f.bio;u.pub=f.pub==='1'?1:0;save();toast('Saved');render()},
avatar(e){const fl=e.target.files[0];if(!fl||fl.size>300000)return toast('Choose an image under 300 KB.');const r=new FileReader();r.onload=()=>{me().avatar=r.result;save();render()};r.readAsDataURL(fl)},
chpw(e){const f=fd(e),u=me();if(u.pw!==hs(f.old))return toast('Current password is wrong.');if(f.nw.length<8||!/\d/.test(f.nw))return toast('New password needs 8+ characters and a number.');u.pw=hs(f.nw);save();toast('Password changed');e.target.reset()},
verify(){me().ver=1;save();toast('Email verified (simulated)');render()},
readAll(){D().notifs.forEach(n=>n.r=1);save();render()},
adm(a,id){if(!me().admin)return;if(a==='ban'){const u=U(id);u.banned=!u.banned}if(a==='del'){S.users=S.users.filter(u=>u.id!==id);delete S.data[id];S.posts=S.posts.filter(p=>p.uid!==id)}if(a==='rm'){S.posts=S.posts.filter(p=>p.id!==id);S.reports=S.reports.filter(r=>r.pid!==id)}if(a==='dis')S.reports=S.reports.filter(r=>r.id!==id);save();render()},
badge(e){if(!me().admin)return;const f=fd(e);if(f.n.trim()&&+f.p>0){S.badges.push({n:f.n.trim(),p:+f.p});S.badges.sort((a,b)=>a.p-b.p);save();render()}},
dbadge(i){S.badges.splice(i,1);save();render()},
carry(){const d=D(),y=d.goals.filter(g=>g.type==='daily'&&!g.done&&g.date===ago(1));y.forEach(g=>g.date=TD());save();toast(y.length?'Moved '+y.length+' goal(s) to today.':'Nothing to carry over.');render()},
reset2(){if(confirm('Erase ALL local data and restart?')){localStorage.removeItem(K);S=seed();go('landing');render()}}
};
/* ---------- pages ---------- */
const pub=()=>`<div class="top"><a href="#landing" class="logo">${logo()}CHALLENGE</a><div><button class="btn o s" onclick="A.lang()">${S.lang==='en'?'العربية':'English'}</button> <a class="btn o s" href="#login">${t('login')}</a> <a class="btn s" href="#signup">${t('signup')}</a></div></div>`;
const P={};
P.landing=()=>pub()+`<section class="hero"><div style="display:grid;place-items:center">${logo(72)}</div><h1>${S.lang==='en'?'Better You.<br><em>Bigger Future.</em>':t('tag')}</h1><p class="mu" style="font-size:18px">Thirty days. Daily missions, habits, savings and goals in one system built around discipline and consistency.</p><div class="days">${Array.from({length:30},(_,i)=>`<i style="animation-delay:${i*.1}s"></i>`).join('')}</div><a class="btn" href="#signup" style="padding:14px 28px;font-size:17px">Start your 30 days</a></section>
<section class="grid" style="max-width:1000px;margin:20px auto;padding:0 18px">${[['Goals','Daily, weekly and monthly targets with deadlines.'],['Habits','Build good habits, break bad ones, keep streaks.'],['Finance','Track income, expenses and savings in DZD, USD or EUR.'],['Compete','Earn points and badges, climb the leaderboard.']].map(x=>`<div class="card"><h3>${x[0]}</h3><span class="mu">${x[1]}</span></div>`).join('')}</section><p class="mu" style="text-align:center;padding:30px">© CHALLENGE</p>`;
const authBox=(title,form,foot)=>pub()+`<div class="card auth"><h2>${title}</h2>${form}<p class="err" id="err" role="alert"></p>${foot||''}</div>`;
P.signup=()=>authBox(t('signup'),`<form onsubmit="return A.signup(event)||false"><label>Full name</label><input name="name" required><label>Username</label><input name="username" required><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required minlength="8"><br><br><button class="btn" style="width:100%">${t('signup')}</button></form>`,`<p class="mu">Have an account? <a href="#login" style="color:var(--g)">${t('login')}</a></p>`);
P.login=()=>authBox(t('login'),`<form onsubmit="A.login(event)"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><br><br><button class="btn" style="width:100%">${t('login')}</button></form>`,`<p class="mu"><a href="#forgot" style="color:var(--g)">Forgot password?</a> · <a href="#signup" style="color:var(--g)">${t('signup')}</a></p>`);
P.forgot=()=>S.rst?authBox('New password',`<form onsubmit="A.reset(event)"><label>New password</label><input name="password" type="password" required minlength="8"><br><br><button class="btn" style="width:100%">Save password</button></form>`):authBox('Reset password',`<form onsubmit="A.forgot(event)"><label>Email</label><input name="email" type="email" required><br><br><button class="btn" style="width:100%">Continue</button></form><p class="mu">No email service is connected, so reset is simulated in this build.</p>`);

function tr1(k){if(AR[k])return AR[k];for(const[r,f]of RX){const m=k.match(r);if(m)return f(m)}if(/[.!?]\s/.test(k)){const p=k.split(/(?<=[.!?])\s+/).map(x=>AR[x]||x);return p.join(' ')}return k}

function arDom(root){if(S.lang!=='ar'||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}root.querySelectorAll('[placeholder],[aria-label]').forEach(e=>['placeholder','aria-label'].forEach(k=>{const v=e.getAttribute(k);if(v)e.setAttribute(k,tr(v))}))}
